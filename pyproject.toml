[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devtoolkit"
version = "1.3.0"
description = "A lightweight, zero-dependency developer utility toolkit for daily software engineering tasks."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Ashish Ranjan Singh", email = "singhashishranjan362@gmail.com" }
]
keywords = [
    "totp",
    "treap",
    "kd-tree",
    "lfu-cache",
    "base62",
    "bipartite-matching",
    "utility", "toolkit", "zero-dependency", "data-structures",
    "algorithms", "graph", "astar", "fenwick-tree", "segment-tree",
    "radix-sort", "huffman", "morse-code", "roman-numerals", "geohash"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities"
]

[project.scripts]
devtoolkit = "cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503"]

[tool.isort]
profile = "black"
line_length = 120
