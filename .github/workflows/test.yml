name: DevToolkit CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run automated unit tests
        run: |
          python -m unittest discover tests -v

      - name: Verify CLI interface
        run: |
          python cli.py --help
          python cli.py uuid
          python cli.py luhn-check 49927398716
          python cli.py contrast "#ffffff" "#000000"
          python cli.py semver-bump 1.0.0 --type minor
          python cli.py currency 1250 --code USD
          python cli.py ordinal 42
          python cli.py slug "Continuous Integration Test 2026"
          python cli.py guess-mime "style.css"
          python cli.py b58-encode "Hello World!"
          python cli.py soundex "Robert"
          python cli.py soundex-match "Robert" "Rupert"
          python cli.py morse-encode "SOS"
          python cli.py to-roman 2026
          python cli.py convert-units 1 km m
          python cli.py rgb-to-cmyk 255 0 0
